services:
  - type: web
    runtime: node
    name: mybrain-ai-tracker-web
    repo: https://github.com/dumbfounder/mybrain
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    autoDeployTrigger: commit
    envVars:
      - key: VITE_REMOTE_HISTORY_MODE
        value: server
      - key: VITE_MYBRAIN_API_BASE
        value: ""
      - key: MYBRAIN_HISTORY_BRANCH
        value: main
      - key: MYBRAIN_REMOTE_CONTROL_TOKEN
        sync: false
      - key: MYBRAIN_HISTORY_REPO
        sync: false
      - key: GITHUB_TOKEN
        sync: false

services:
  - type: web
    runtime: static
    name: mybrain-ai-tracker
    repo: https://github.com/dumbfounder/mybrain
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeployTrigger: commit
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
